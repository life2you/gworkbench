<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GWorkbench · 自定义工作区标签 UI 原型</title>
<style>
  :root {
    --bg-desktop: #0b0c0f;
    --bg-window: #1c1c1f;
    --bg-sidebar: #161619;
    --bg-content: #1e1e22;
    --bg-detail: #19191d;
    --bg-card: rgba(255, 255, 255, 0.04);
    --bg-card-hover: rgba(255, 255, 255, 0.07);
    --bg-input: rgba(0, 0, 0, 0.35);
    --border: rgba(255, 255, 255, 0.09);
    --border-subtle: rgba(255, 255, 255, 0.05);
    --text-1: #f4f4f6;
    --text-2: #a0a2ad;
    --text-3: #6c6e79;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, 0.15);
    --orange: #ff9f0a;
    --orange-soft: rgba(255, 159, 10, 0.16);
    --purple: #bf5af2;
    --purple-soft: rgba(191, 90, 242, 0.16);
    --red: #ff453a;
    --red-soft: rgba(255, 69, 58, 0.16);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 0%, #1d2230 0%, #0b0c0f 55%);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-size: 12.5px;
    line-height: 1.45;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部原型导览条 */
  .proto-bar {
    height: 40px;
    background: rgba(12, 13, 17, 0.94);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-2);
    flex-shrink: 0;
  }
  .proto-bar.hidden { display: none; }
  .proto-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .proto-badge {
    background: var(--accent-soft);
    color: #64b5ff;
    border: 1px solid rgba(10, 132, 255, 0.35);
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 600;
    font-size: 11px;
    flex-shrink: 0;
  }
  .proto-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .proto-btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-1);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.15s;
  }
  .proto-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .proto-btn.primary {
    background: rgba(10, 132, 255, 0.22);
    border-color: rgba(10, 132, 255, 0.45);
    color: #8cc8ff;
  }

  /* macOS 窗口主体 */
  .app-stage {
    flex: 1;
    padding: 14px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-height: 0;
  }
  body.chromeless .app-stage { padding: 0; }

  .mac-window {
    width: 100%;
    max-width: 1460px;
    background: var(--bg-window);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.68), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    overflow: hidden;
    position: relative;
  }
  body.chromeless .mac-window {
    max-width: none;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }

  /* 1. 左侧 Sidebar */
  .sidebar {
    width: 256px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .window-controls {
    height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .traffic-lights { display: flex; gap: 7px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }
  .app-title { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: 0.2px; }

  /* 核心设计：用户自定义工作区标签栏 */
  .workspace-switcher-wrap {
    padding: 4px 12px 10px;
  }
  .workspace-switcher-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .workspace-tabs {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .workspace-tabs::-webkit-scrollbar { display: none; }
  .ws-tab-btn {
    flex: 1 0 auto;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 5.5px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: 0.15s;
    white-space: nowrap;
  }
  .ws-tab-btn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.04); }
  .ws-tab-btn.active-github {
    background: linear-gradient(180deg, rgba(191, 90, 242, 0.28), rgba(191, 90, 242, 0.16));
    color: #f3d9ff;
    box-shadow: inset 0 0 0 1px rgba(191, 90, 242, 0.45);
    font-weight: 600;
  }
  .ws-tab-btn.active-gitlab {
    background: linear-gradient(180deg, rgba(255, 159, 10, 0.28), rgba(255, 159, 10, 0.16));
    color: #ffe3b3;
    box-shadow: inset 0 0 0 1px rgba(255, 159, 10, 0.45);
    font-weight: 600;
  }
  .ws-add-btn {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-2);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }
  .ws-add-btn:hover {
    background: var(--accent-soft);
    border-color: rgba(10, 132, 255, 0.45);
    color: #8cc8ff;
  }

  .workspace-meta-strip {
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 10.5px;
    color: var(--text-3);
  }
  .workspace-meta-path {
    font-family: var(--font-mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .workspace-edit-link {
    color: #7ac0ff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .workspace-edit-link:hover { text-decoration: underline; }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 12px;
  }
  .sidebar-group-title {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 8px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 9px;
    border-radius: 7px;
    color: var(--text-2);
    cursor: pointer;
    margin-bottom: 2px;
    transition: 0.12s;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-1); }
  .nav-item.active {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  .nav-item-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nav-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-2);
    flex-shrink: 0;
  }
  .nav-item.active .nav-badge {
    background: rgba(255, 255, 255, 0.24);
    color: #fff;
  }

  .repo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5.5px 9px;
    border-radius: 6px;
    color: var(--text-2);
    cursor: pointer;
    margin-bottom: 1px;
    font-size: 12px;
  }
  .repo-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-1); }
  .repo-item.active { background: rgba(255, 255, 255, 0.11); color: var(--text-1); font-weight: 500; }

  .sidebar-footer {
    border-top: 1px solid var(--border-subtle);
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .sidebar-footer-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sidebar-footer-text {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 2. 中间 Content Column */
  .content-col {
    flex: 1;
    background: var(--bg-content);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .toolbar {
    height: 46px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .toolbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .toolbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .repo-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    font-weight: 600;
    font-size: 12px;
    color: var(--text-1);
    white-space: nowrap;
  }
  .segmented {
    display: inline-flex;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 3.5px 10px;
    border-radius: 5px;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg-btn.active { background: rgba(255, 255, 255, 0.14); color: var(--text-1); font-weight: 500; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    color: var(--text-2);
    font-size: 11.5px;
    min-width: 165px;
  }
  .btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-1);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.12s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.11); }
  .btn-primary {
    background: var(--accent);
    border-color: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  .btn-primary:hover { background: #1d8fff; }
  .btn-orange {
    background: rgba(255, 159, 10, 0.2);
    border-color: rgba(255, 159, 10, 0.45);
    color: #ffd085;
  }
  .btn-green {
    background: rgba(48, 209, 88, 0.2);
    border-color: rgba(48, 209, 88, 0.45);
    color: #82f09e;
  }
  .btn-danger {
    background: rgba(255, 69, 58, 0.14);
    border-color: rgba(255, 69, 58, 0.35);
    color: #ff827b;
  }

  .main-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* KPI */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
  }
  .kpi-label { font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
  .kpi-val { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .kpi-sub { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }

  /* Table */
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.data-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.015);
    position: sticky;
    top: 0;
  }
  table.data-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: middle;
  }
  table.data-table tr.row-selectable { cursor: pointer; }
  table.data-table tr.row-selectable:hover { background: rgba(255, 255, 255, 0.035); }
  table.data-table tr.row-selected { background: rgba(10, 132, 255, 0.14); }

  .mono { font-family: var(--font-mono); font-size: 11.5px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .pill-green { background: var(--green-soft); color: #6ae68a; }
  .pill-orange { background: var(--orange-soft); color: #ffc15e; }
  .pill-purple { background: var(--purple-soft); color: #df9dff; }
  .pill-red { background: var(--red-soft); color: #ff857e; }
  .pill-gray { background: rgba(255, 255, 255, 0.08); color: var(--text-2); }
  .pill-blue { background: var(--accent-soft); color: #7ac0ff; }

  /* Console */
  .console-drawer {
    height: 175px;
    border-top: 1px solid var(--border);
    background: #141417;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .console-tabs {
    height: 34px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .console-tab-list { display: flex; gap: 4px; }
  .console-tab {
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11.5px;
    color: var(--text-2);
    cursor: pointer;
  }
  .console-tab.active { background: rgba(255, 255, 255, 0.1); color: var(--text-1); font-weight: 500; }
  .console-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }

  /* Bottom Status Bar */
  .status-bar {
    height: 28px;
    padding: 0 14px;
    border-top: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-3);
    flex-shrink: 0;
  }

  /* Cards & Forms */
  .sync-wrap { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .conflict-banner {
    background: linear-gradient(135deg, rgba(255, 159, 10, 0.14), rgba(255, 69, 58, 0.09));
    border: 1px solid rgba(255, 159, 10, 0.45);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Settings */
  .settings-layout {
    flex: 1;
    display: grid;
    grid-template-columns: 215px 1fr;
    min-height: 0;
  }
  .settings-nav {
    border-right: 1px solid var(--border);
    padding: 12px 10px;
    background: rgba(0, 0, 0, 0.14);
  }
  .settings-content {
    padding: 18px 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
  .form-label { font-size: 11.5px; font-weight: 500; color: var(--text-2); }
  .form-hint { font-size: 11px; color: var(--text-3); }
  .form-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text-1);
    font-size: 12px;
    font-family: var(--font-sans);
    outline: none;
  }
  .form-input:focus {
    border-color: rgba(10, 132, 255, 0.65);
    box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.18);
  }
  .form-input.mono { font-family: var(--font-mono); }

  /* Workspace Profile Cards inside Settings */
  .ws-profile-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: 0.15s;
  }
  .ws-profile-card.is-current {
    border-color: rgba(10, 132, 255, 0.5);
    background: rgba(10, 132, 255, 0.06);
  }
  .ws-profile-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ws-profile-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .ws-dir-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 9px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--border-subtle);
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-1);
  }

  /* Platform Choice Cards inside Modal */
  .platform-pick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .platform-pick-card {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 9px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
    color: var(--text-1);
  }
  .platform-pick-card:hover { background: rgba(255, 255, 255, 0.06); }
  .platform-pick-card.selected-github {
    border-color: rgba(191, 90, 242, 0.7);
    background: rgba(191, 90, 242, 0.14);
  }
  .platform-pick-card.selected-gitlab {
    border-color: rgba(255, 159, 10, 0.7);
    background: rgba(255, 159, 10, 0.14);
  }

  /* 3. 右侧 Detail Column */
  .detail-col {
    width: 340px;
    background: var(--bg-detail);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .detail-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; word-break: break-all; }
  .detail-sub { font-size: 11.5px; color: var(--text-2); }
  .detail-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .kv-list { display: flex; flex-direction: column; gap: 7px; font-size: 11.5px; }
  .kv-item { display: flex; justify-content: space-between; gap: 10px; }
  .kv-k { color: var(--text-3); flex-shrink: 0; }
  .kv-v { color: var(--text-1); text-align: right; word-break: break-all; }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .step-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-subtle);

function activeWS() {
  return WORKSPACES.find(w => w.id === state.activeWorkspaceId) || WORKSPACES[0];
}

function platformIcon(p) { return p === 'github' ? '🐙' : '🦊'; }
function platformLabel(p) { return p === 'github' ? 'GitHub' : 'GitLab'; }

function setWorkspace(id) {
  state.activeWorkspaceId = id;
  state.selectedRepoIndex = 0;
  state.selectedWorktreeIndex = 1;
  state.selectedRequestIndex = 0;
  render();
}

function setSection(s) {
  state.section = s;
  render();
}

function setSettingsTab(t) {
  state.settingsTab = t;
  render();
}

function render() {
  const ws = activeWS();

  // Top-left custom workspace tabs
  document.getElementById('workspace-tabs').innerHTML = WORKSPACES.map(w => {
    const isActive = w.id === ws.id;
    const activeCls = isActive ? (w.platform === 'github' ? 'active-github' : 'active-gitlab') : '';
    return `
      <button class="ws-tab-btn ${activeCls}" onclick="setWorkspace('${w.id}')">
        <span>${platformIcon(w.platform)}</span>
        <span>${w.name}</span>
      </button>
    `;
  }).join('');

  document.getElementById('workspace-meta-strip').innerHTML = `
    <span class="workspace-meta-path" title="${ws.dirs.join(', ')}">📂 ${ws.dirs[0]}${ws.dirs.length > 1 ? ` +${ws.dirs.length - 1}` : ''}</span>

  `;

  const reqTitle = ws.platform === 'github' ? 'Pull Requests' : 'Merge Requests';
  const mergedCount = ws.worktrees.filter(w => w.kind !== '主仓库' && ws.baselines.every(b => w.merged[b])).length || null;
  const navDefs = [
    { id: 'dashboard', icon: '📊', title: '看板', badge: mergedCount },
    { id: 'worktrees', icon: '🌿', title: '工作树', badge: ws.worktrees.length },

    { id: 'requests', icon: '🔁', title: reqTitle, badge: ws.requests.length },

          <div class="kv-item"><span class="kv-k">Rebased</span><span class="kv-v" style="color:var(--green)">✓ 已安装</span></div>
          <div class="kv-item"><span class="kv-k">GitHub gh CLI</span><span class="kv-v" style="color:var(--green)">✓ 已登录</span></div>
          <div class="kv-item"><span class="kv-k">${ws.name} 凭据</span><span class="kv-v" style="color:var(--green)">✓ 已就绪</span></div>
        </div>
      </div>

      <button class="btn" onclick="openEditWorkspace('${ws.id}')">✏️ 编辑「${ws.name}」标签配置</button>
      <button class="btn btn-primary" onclick="openModal('createWorkspace')">+ 新建另一个工作区标签</button>
    </div>
  `;
}

function openEditWorkspace(id) {
  const ws = WORKSPACES.find(w => w.id === id);
  if (!ws) return;
  state.wsDraft = {
    mode: 'edit',
    editingId: ws.id,
    name: ws.name,
    platform: ws.platform,
    dirs: [...ws.dirs],
    newDirInput: '',
    worktreesRoot: ws.worktreesRoot || '',
    host: ws.host || 'https://gitlab.example.com',
    token: ws.tokenMask || '',
    defaultTargetBranch: ws.defaultTargetBranch || 'main',
    baselinesText: ws.baselines.join(', '),
    envBranchesText: ws.envBranches.join(', '),
    mergeMiddle: ws.mergeMiddle || 'sync',
    testResult: null
  };
  openModal('createWorkspace');
}

function deleteWorkspace(id) {
  const idx = WORKSPACES.findIndex(w => w.id === id);
  if (idx === -1 || WORKSPACES.length <= 1) return;
  WORKSPACES.splice(idx, 1);
  if (state.activeWorkspaceId === id) {
    state.activeWorkspaceId = WORKSPACES[0].id;
  }
  render();
}

function setDraftPlatform(p) {
  state.wsDraft.platform = p;
  if (state.wsDraft.mode === 'create' && !state.wsDraft.nameTouched) {
    state.wsDraft.name = p === 'github' ? '开源 GitHub' : '私有 GitLab';
  }
  if (p === 'github' && state.wsDraft.baselinesText === 'master, stage, test, uat') {
    state.wsDraft.baselinesText = 'main';
    state.wsDraft.host = 'https://github.com';
  } else if (p === 'gitlab' && state.wsDraft.baselinesText === 'main') {
    state.wsDraft.baselinesText = 'master, stage, test, uat';
    state.wsDraft.host = 'http://10.10.20.88:8090';
  }
  state.wsDraft.testResult = null;
  renderWorkspaceModal();
}

function addDraftDir() {
  const val = document.getElementById('draftDirInput')?.value.trim();
  const path = val || ('~/vibeCodes/new-folder-' + (state.wsDraft.dirs.length + 1));
  if (!state.wsDraft.dirs.includes(path)) {
    state.wsDraft.dirs.push(path);
  }
  renderWorkspaceModal();
}

function removeDraftDir(idx) {
  state.wsDraft.dirs.splice(idx, 1);
  renderWorkspaceModal();
}

function testDraftConnection() {
  state.wsDraft.testResult = state.wsDraft.platform === 'gitlab'
    ? '✓ GitLab API v4 连通成功 · 当前用户 @chen'
    : '✓ GitHub API 连通成功 · gh CLI (@life2you)';
  renderWorkspaceModal();
}

function saveWorkspaceDraft() {
  const nameInput = document.getElementById('draftWsName')?.value.trim();
  const name = nameInput || (state.wsDraft.platform === 'github' ? 'GitHub 工作区' : 'GitLab 工作区');
  const baselines = (document.getElementById('draftBaselines')?.value || '')
    .split(',').map(s => s.trim()).filter(Boolean);

  if (state.wsDraft.mode === 'edit' && state.wsDraft.editingId) {
    const target = WORKSPACES.find(w => w.id === state.wsDraft.editingId);
    if (target) {
      target.name = name;
      target.platform = state.wsDraft.platform;
      target.dirs = state.wsDraft.dirs.length ? [...state.wsDraft.dirs] : ['~/Code'];
      target.baselines = baselines.length ? baselines : (target.platform === 'github' ? ['main'] : ['master', 'stage', 'test']);
      if (target.platform === 'gitlab') {
        target.host = document.getElementById('draftGitlabHost')?.value.trim() || target.host;
        target.envBranches = (document.getElementById('draftEnvBranches')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        target.mergeMiddle = document.getElementById('draftMergeMiddle')?.value.trim() || 'sync';
        target.statusText = `GitLab · ${target.host.replace(/^https?:\/\//, '')}`;
      } else {
        target.host = document.getElementById('draftGithubHost')?.value.trim() || 'https://github.com';
        target.defaultTargetBranch = document.getElementById('draftDefaultBranch')?.value.trim() || 'main';
        target.statusText = `GitHub · ${target.host.replace(/^https?:\/\//, '')}`;
      }
      state.activeWorkspaceId = target.id;
    }
  } else {
    const p = state.wsDraft.platform;
    const id = 'ws-' + Date.now();
    const hostVal = p === 'gitlab'
      ? (document.getElementById('draftGitlabHost')?.value.trim() || 'https://gitlab.example.com')
      : (document.getElementById('draftGithubHost')?.value.trim() || 'https://github.com');
    const dirs = state.wsDraft.dirs.length ? [...state.wsDraft.dirs] : ['~/Code/custom'];
    const newWs = {
      id,
      name,
      platform: p,
      dirs,
      worktreesRoot: document.getElementById('draftWorktreeRoot')?.value.trim() || '~/vibeCodes/worktrees',
      host: hostVal,
      tokenMode: p === 'github' ? 'gh_cli' : 'pat',
      tokenMask: '••••••',
      defaultTargetBranch: document.getElementById('draftDefaultBranch')?.value.trim() || 'main',
      baselines: baselines.length ? baselines : (p === 'github' ? ['main'] : ['master', 'stage', 'test', 'uat']),
      envBranches: p === 'gitlab'
        ? (document.getElementById('draftEnvBranches')?.value || 'dev, test, stage, uat').split(',').map(s => s.trim()).filter(Boolean)
        : [],
      mergeMiddle: p === 'gitlab' ? (document.getElementById('draftMergeMiddle')?.value.trim() || 'sync') : '',
      statusText: p === 'github' ? `GitHub · ${hostVal.replace(/^https?:\/\//, '')}` : `GitLab · ${hostVal.replace(/^https?:\/\//, '')}`,
      repos: [
        { name: p === 'github' ? 'my-oss-lib' : 'core-service', branch: p === 'github' ? 'main' : 'master', wtCount: 2, remote: p === 'github' ? 'github.com/user/my-oss-lib' : hostVal.replace(/^https?:\/\//, '') + '/team/core-service' }
      ],
      worktrees: [
        { branch: p === 'github' ? 'main' : 'master', kind: '主仓库', desc: '主干基准分支', dirty: false, dirtyText: '干净', disk: '240 MB', updated: '刚刚', merged: { main: true, master: true, stage: true, test: true, uat: true }, path: dirs[0] + '/repo' },
        { branch: 'feat/init-setup', kind: '工作树', desc: '新建工作区验证分支', dirty: false, dirtyText: '干净', disk: '238 MB', updated: '刚刚', merged: { main: false, master: false, stage: true, test: true, uat: false }, path: '~/vibeCodes/worktrees/repo/feat-init-setup' }
      ],
      requests: [
        { number: p === 'github' ? '#1' : '!1', title: 'feat: initial workspace setup', flow: `feat/init-setup → ${p === 'github' ? 'main' : 'master'}`, author: 'you', updated: '刚刚', ci: '通过', approval: '待审批', status: '可合并', canApprove: true, mine: true }
      ]
    };
    WORKSPACES.push(newWs);
    state.activeWorkspaceId = id;
  }

  closeModal();
  render();
}

function renderWorkspaceModal() {
  const sheet = document.getElementById('modalSheet');
  const d = state.wsDraft;
  const isEdit = d.mode === 'edit';

  sheet.innerHTML = `
    <div class="modal-header">
      <strong>${isEdit ? '✏️ 编辑工作区标签' : '🏷️ 新建工作区标签'}</strong>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">1. 选择托管平台类型</label>
        <div class="platform-pick-grid">
          <button type="button" class="platform-pick-card ${d.platform === 'gitlab' ? 'selected-gitlab' : ''}" onclick="setDraftPlatform('gitlab')">
            <div style="font-size:13.5px; font-weight:600; margin-bottom:3px;">🦊 GitLab（自建 / SaaS）</div>
            <div class="form-hint">绑定内网或私有 GitLab Host、Access Token、环境分支链与 Merge Requests</div>
          </button>
          <button type="button" class="platform-pick-card ${d.platform === 'github' ? 'selected-github' : ''}" onclick="setDraftPlatform('github')">
            <div style="font-size:13.5px; font-weight:600; margin-bottom:3px;">🐙 GitHub</div>
            <div class="form-hint">自动继承系统 gh CLI 或配置 PAT，管理 Pull Requests 与主干基线</div>
          </button>
        </div>
      </div>

      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">2. 标签显示名称（显示在左上角切换栏）</label>
        <input id="draftWsName" class="form-input" value="${d.name}" placeholder="例如：公司 GitLab、个人 GitHub、外包项目" oninput="state.wsDraft.name=this.value; state.wsDraft.nameTouched=true" />
      </div>

      <div class="card" style="padding:12px 14px;">
        <div class="card-title" style="margin-bottom:6px;">
          <span>3. 绑定的本地代码仓库目录</span>
          <span class="pill pill-blue">直接归属此标签 · 不再按 URL 猜测</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:5px; margin-bottom:8px;">
          ${d.dirs.map((dir, i) => `
            <div class="ws-dir-chip">
              <span>📁 ${dir}</span>
              <span style="color:var(--red); cursor:pointer; font-family:var(--font-sans);" onclick="removeDraftDir(${i})">移除</span>
            </div>
          `).join('')}

        <div style="display:flex; gap:6px;">
          <input id="draftDirInput" class="form-input mono" style="flex:1" placeholder="~/vibeCodes/company-repos" />
          <button class="btn" onclick="addDraftDir()">📂 选择 / 添加目录</button>
        </div>
      </div>

      ${d.platform === 'gitlab' ? `
        <div class="card" style="padding:12px 14px;">
          <div class="card-title"><span>4. GitLab 实例与工作流配置</span></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">GitLab Host 地址</label>
              <input id="draftGitlabHost" class="form-input mono" value="${d.host}" placeholder="http://10.10.20.88:8090" />
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">Access Token (Keychain)</label>
              <input class="form-input mono" type="password" value="${d.token}" placeholder="glpat-..." />
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr 120px; gap:10px; margin-top:10px;">
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">看板检查基线</label>
              <input id="draftBaselines" class="form-input mono" value="${d.baselinesText}" />
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">环境同步分支</label>
              <input id="draftEnvBranches" class="form-input mono" value="${d.envBranchesText}" />
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">同步中间词</label>
              <input id="draftMergeMiddle" class="form-input mono" value="${d.mergeMiddle}" />
            </div>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px;">
            <button class="btn" onclick="testDraftConnection()">🔌 测试 GitLab 连通性</button>
            ${d.testResult ? `<span style="font-size:11.5px; color:var(--green)">${d.testResult}</span>` : ''}
          </div>
        </div>
      ` : `
        <div class="card" style="padding:12px 14px;">
          <div class="card-title"><span>4. GitHub 实例与工作流配置</span><span class="pill pill-green">支持 github.com / Enterprise</span></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end;">
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">GitHub Host 地址（支持 Enterprise）</label>
              <input id="draftGithubHost" class="form-input mono" value="${d.host || 'https://github.com'}" placeholder="https://github.com 或 https://github.company.com" />
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">Personal Access Token（留空继承 gh CLI）</label>
              <input class="form-input mono" type="password" value="${d.token}" placeholder="可选填入 ghp_... / github_pat_..." />
            </div>
          </div>
          <div style="display:grid; grid-template-columns:180px 1fr; gap:10px; margin-top:10px;">
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">默认 PR 目标分支</label>
              <input id="draftDefaultBranch" class="form-input mono" value="${d.defaultTargetBranch}" />
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label class="form-label">看板检查基线（逗号分隔）</label>
              <input id="draftBaselines" class="form-input mono" value="${d.baselinesText}" />
            </div>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px;">
            <button class="btn" onclick="testDraftConnection()">🔌 测试 GitHub 连通性</button>
            ${d.testResult ? `<span style="font-size:11.5px; color:var(--green)">${d.testResult}</span>` : ''}
          </div>
        </div>
      `}

      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">Worktree 存放目录（可选覆盖，留空继承全局默认 ~/vibeCodes/worktrees）</label>
        <input id="draftWorktreeRoot" class="form-input mono" value="${d.worktreesRoot}" placeholder="留空则使用全局 Worktrees 根目录" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveWorkspaceDraft()">${isEdit ? '保存更改' : '创建并切换到此标签'}</button>
    </div>
  `;
}

function openModal(type) {
  state.modal = type;
  const backdrop = document.getElementById('modalBackdrop');
  const sheet = document.getElementById('modalSheet');
  const ws = activeWS();

  if (type === 'createWorkspace') {
    if (state.wsDraft.mode !== 'edit') {
      state.wsDraft = {
        mode: 'create',
        editingId: null,
        name: '私有 GitLab',
        nameTouched: false,
        platform: 'gitlab',
        dirs: ['~/vibeCodes/hengjian'],
        newDirInput: '',
        worktreesRoot: '',
        host: 'http://10.10.20.88:8090',
        token: '',
        defaultTargetBranch: 'main',
        baselinesText: 'master, stage, test, uat',
        envBranchesText: 'dev, test, stage, uat',
        mergeMiddle: 'sync',
        testResult: null
      };
    }
    renderWorkspaceModal();
  } else if (type === 'createWt') {
    sheet.innerHTML = `
      <div class="modal-header">
        <strong>新建工作树 · ${ws.name} / ${ws.repos[0].name}</strong>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">✨ AI 智能生成分支名（描述要做什么）</label>
          <div style="display:flex; gap:8px;">
            <input class="form-input" style="flex:1" value="修复支付回调偶发超时未重试问题" />
            <button class="btn btn-primary">AI 生成</button>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">新分支名 / 基准分支</label>
          <div style="display:grid; grid-template-columns:1fr 180px; gap:8px;">
            <input class="form-input mono" value="fix/payment-callback-retry" />
            <input class="form-input mono" value="origin/${ws.repos[0].branch}" />
          </div>
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">目标路径</label>
          <input class="form-input mono" value="~/vibeCodes/worktrees/${ws.repos[0].name}/fix-payment-callback-retry" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="closeModal()">创建工作树</button>
      </div>
    `;
  } else if (type === 'sweeper') {
    sheet.innerHTML = `
      <div class="modal-header">
        <strong>🧹 空间清理 · ${ws.repos[0].name}（基线：${ws.baselines.join(' / ')}）</strong>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <table class="data-table">
          <thead><tr><th></th><th>分支</th><th>基线合入</th><th>磁盘</th><th>建议</th></tr></thead>
          <tbody>
            <tr><td><input type="checkbox" checked /></td><td class="mono">${ws.worktrees[ws.worktrees.length - 1].branch}</td><td><span class="pill pill-green">已全部合入</span></td><td>288 MB</td><td><span class="pill pill-green">推荐清理</span></td></tr>
            <tr><td><input type="checkbox" /></td><td class="mono">${ws.worktrees[1].branch}</td><td><span class="pill pill-orange">未合入</span></td><td>295 MB</td><td><span class="pill pill-gray">保留</span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <span style="margin-right:auto; color:var(--text-2); font-size:11.5px;">已选 1 项 · 预计释放 288 MB</span>
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-danger" onclick="closeModal()">确认清理所选</button>
      </div>
    `;
  } else if (type === 'onboarding') {
    sheet.innerHTML = `
      <div class="modal-header">
        <strong>👋 欢迎使用 GWorkbench · 添加你的第一个工作区标签</strong>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div style="font-size:12px; color:var(--text-2);">
          每个标签对应一组代码仓库与平台配置。你可以先建一个常用标签，进入主界面后随时在左上角 <strong>+</strong> 继续添加更多标签。
        </div>
        <div class="platform-pick-grid">
          <div class="platform-pick-card selected-gitlab">
            <div style="font-weight:600; margin-bottom:2px;">🦊 GitLab 工作区</div>
            <div class="form-hint">输入标签名（如「公司 GitLab」）、选择仓库目录、配置 Host & Token</div>
          </div>
          <div class="platform-pick-card">
            <div style="font-weight:600; margin-bottom:2px;">🐙 GitHub 工作区</div>
            <div class="form-hint">输入标签名（如「GitHub」）、选择仓库目录、自动继承 gh CLI</div>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:180px 1fr; gap:10px;">
          <div class="form-row" style="margin-bottom:0">
            <label class="form-label">标签名称</label>
            <input class="form-input" value="公司 GitLab" />
          </div>
          <div class="form-row" style="margin-bottom:0">
            <label class="form-label">对应本地仓库根目录</label>
            <input class="form-input mono" value="~/vibeCodes/hengjian" />
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-row" style="margin-bottom:0">
            <label class="form-label">GitLab Host</label>
            <input class="form-input mono" value="http://10.10.20.88:8090" />
          </div>
          <div class="form-row" style="margin-bottom:0">
            <label class="form-label">Access Token</label>
            <input class="form-input mono" type="password" value="glpat-••••••••" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">稍后再说</button>
        <button class="btn btn-primary" onclick="closeModal()">创建工作区并进入</button>
      </div>
    `;
  }

  backdrop.classList.add('open');
}

function closeModal() {
  state.modal = null;
  state.wsDraft.mode = 'create';
  document.getElementById('modalBackdrop').classList.remove('open');
}

const params = new URLSearchParams(location.search);
if (params.get('chromeless') === '1') document.body.classList.add('chromeless');
if (params.get('hideProtoBar') === '1') document.getElementById('protoBar').classList.add('hidden');
if (params.get('ws')) state.activeWorkspaceId = params.get('ws');
if (params.get('section')) state.section = params.get('section');
if (params.get('settingsTab')) state.settingsTab = params.get('settingsTab');
render();
if (params.get('modal')) openModal(params.get('modal'));
</script>
</body>
</html>

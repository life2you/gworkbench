<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GWorkbench · 导航与工作区布局重构对比原型（方案 A vs 方案 B）</title>
<style>
  :root {
    --bg-desktop: #0b0c0f;
    --bg-window: #1c1c1f;
    --bg-sidebar: #16161a;
    --bg-content: #1e1e22;
    --bg-detail: #18181c;
    --bg-card: rgba(255, 255, 255, 0.038);
    --bg-card-hover: rgba(255, 255, 255, 0.068);
    --bg-input: rgba(0, 0, 0, 0.36);
    --border: rgba(255, 255, 255, 0.09);
    --border-subtle: rgba(255, 255, 255, 0.05);
    --text-1: #f4f4f6;
    --text-2: #a0a3ae;
    --text-3: #6c6f7a;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, 0.15);
    --orange: #ff9f0a;
    --orange-soft: rgba(255, 159, 10, 0.16);
    --purple: #bf5af2;
    --purple-soft: rgba(191, 90, 242, 0.16);
    --red: #ff453a;
    --red-soft: rgba(255, 69, 58, 0.16);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 0%, #1d2230 0%, #0b0c0f 55%);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-size: 12.5px;
    line-height: 1.45;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部原型切换条 */
  .proto-bar {
    height: 44px;
    background: rgba(11, 12, 16, 0.96);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .proto-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .proto-badge {
    background: var(--accent-soft);
    color: #70bdff;
    border: 1px solid rgba(10, 132, 255, 0.38);
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 600;
    font-size: 11px;
    flex-shrink: 0;
  }
  .scheme-switch {
    display: inline-flex;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .scheme-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .scheme-btn:hover { color: var(--text-1); }
  .scheme-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(10, 132, 255, 0.35);
  }
  .scheme-rec {
    font-size: 9.5px;
    background: rgba(48, 209, 88, 0.22);
    color: #6ee78f;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .scheme-btn.active .scheme-rec {
    background: rgba(255,255,255,0.22);
    color: #fff;
  }
  .proto-desc {
    color: var(--text-2);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* macOS 窗口 */
  .app-stage {
    flex: 1;
    padding: 14px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-height: 0;
  }
  .mac-window {
    width: 100%;
    max-width: 1460px;
    background: var(--bg-window);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.68), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* 通用按钮 */
  .btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--text-1);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.11); }
  .btn-primary { background: var(--accent); border-color: rgba(255,255,255,0.15); color: #fff; }
  .btn-primary:hover { background: #1c8eff; }
  .btn-green { background: rgba(48, 209, 88, 0.18); border-color: rgba(48, 209, 88, 0.42); color: #6ee78f; }
  .btn-orange { background: rgba(255, 159, 10, 0.16); border-color: rgba(255, 159, 10, 0.4); color: #ffc366; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
  }
  .pill-green { background: var(--green-soft); color: #67e88a; }
  .pill-orange { background: var(--orange-soft); color: #ffc366; }
  .pill-purple { background: var(--purple-soft); color: #df9eff; }
  .pill-blue { background: var(--accent-soft); color: #7ac1ff; }
  .pill-red { background: var(--red-soft); color: #ff827b; }
  .pill-gray { background: rgba(255,255,255,0.08); color: var(--text-2); }

  /* 左侧边栏 */
  .sidebar {
    width: 248px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.18s ease;
  }
  .sidebar.compact {
    width: 204px;
  }
  .window-controls {
    height: 36px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .traffic { display: flex; gap: 7px; margin-right: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .win-title-mini { font-size: 11.5px; color: var(--text-3); font-weight: 600; }

  /* 工作区标签 */
  .ws-header {
    padding: 4px 10px 8px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .ws-row { display: flex; gap: 5px; align-items: center; }
  .ws-tabs {
    flex: 1;
    display: flex;
    gap: 3px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 3px;
    overflow-x: auto;
  }
  .ws-tab {
    flex: 1;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }
  .ws-tab.active.gitlab {
    background: rgba(255, 159, 10, 0.16);
    border-color: rgba(255, 159, 10, 0.45);
    color: #ffbe5c;
    font-weight: 600;
  }
  .ws-tab.active.github {
    background: rgba(191, 90, 242, 0.16);
    border-color: rgba(191, 90, 242, 0.45);
    color: #e09eff;
    font-weight: 600;
  }
  .ws-add-btn {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text-2);
    cursor: pointer;
    font-size: 14px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .ws-add-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }

  .ws-path-chip {
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-3);
    font-family: var(--font-mono);
  }
  .ws-path-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-path-chip a { color: var(--accent); font-family: var(--font-sans); font-weight: 600; cursor: pointer; margin-left: 6px; }

  /* 侧边栏搜索（方案 A） */
  .repo-search-wrap {
    padding: 8px 10px 4px;
  }
  .repo-search {
    width: 100%;
    height: 27px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-1);
    padding: 0 9px;
    font-size: 11.5px;
    outline: none;
  }
  .repo-search:focus { border-color: rgba(10,132,255,0.55); }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
  }
  .sec-title {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-3);
    padding: 6px 8px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 9px;
    border-radius: 7px;
    color: var(--text-2);
    cursor: pointer;
    margin-bottom: 2px;
    font-size: 12px;
    transition: 0.12s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.045); color: var(--text-1); }
  .nav-item.active {
    background: rgba(10, 132, 255, 0.22);
    color: #fff;
    font-weight: 600;
  }
  .nav-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .nav-left span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repo-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .repo-dot.clean { background: var(--green); }
  .repo-dot.warn { background: var(--orange); }
  .repo-dot.idle { background: rgba(255,255,255,0.22); }
  .nav-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text-2);
    font-family: var(--font-mono);
  }
  .nav-item.active .nav-badge { background: rgba(255,255,255,0.2); color: #fff; }

  /* 侧边栏底部固定设置区（关键设计：不再让上面出现空洞） */
  .sidebar-bottom-dock {
    border-top: 1px solid var(--border);
    padding: 7px 8px;
    background: rgba(0, 0, 0, 0.16);
  }
  .settings-dock-btn {
    width: 100%;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.04);
    color: var(--text-1);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.14s;
  }
  .settings-dock-btn:hover { background: rgba(255,255,255,0.09); border-color: var(--border); }
  .settings-dock-btn.active { background: var(--accent-soft); border-color: rgba(10,132,255,0.45); color: #8cc8ff; }

  .sidebar-footer {
    height: 28px;
    padding: 0 11px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-3);
    background: rgba(0,0,0,0.25);
  }

  /* 主区域 */
  .main-workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-content);
  }

  /* 方案 A 顶部导航栏：当前仓库 + 4 态横向 Tab + 动作按钮 */
  .top-header-a {
    height: 50px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-shrink: 0;
  }
  .repo-identity {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .repo-identity .repo-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .repo-branch-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-2);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-subtle);
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }

  .view-tabs-a {
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
  }
  .view-tab-a {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: 0.14s;
  }
  .view-tab-a:hover { color: var(--text-1); background: rgba(255,255,255,0.04); }
  .view-tab-a.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .tab-count {
    font-size: 10px;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    color: var(--text-2);
    font-family: var(--font-mono);
  }
  .view-tab-a.active .tab-count { background: var(--accent); color: #fff; }

  /* 方案 B 顶部全局仓库选择器条 */
  .top-header-b {
    height: 46px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .repo-bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .repo-select-b {
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    color: var(--text-1);
    padding: 4px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .quick-repo-pills { display: flex; gap: 4px; overflow-x: auto; }
  .quick-repo-pill {
    border: 1px solid var(--border-subtle);
    background: rgba(255,255,255,0.03);
    color: var(--text-2);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .quick-repo-pill.active {
    background: var(--accent-soft);
    border-color: rgba(10,132,255,0.4);
    color: #84c5ff;
    font-weight: 600;
  }

  /* 中间 + 右侧双栏内容体 */
  .split-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .center-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
  }
  .right-pane {
    width: 340px;
    background: var(--bg-detail);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 14px;
    gap: 12px;
  }

  /* 子工具栏 */
  .sub-toolbar {
    padding: 9px 16px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(0,0,0,0.1);
  }
  .seg-control {
    display: inline-flex;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }
  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
  }
  .seg-btn.active {
    background: rgba(255,255,255,0.12);
    color: var(--text-1);
    font-weight: 600;
  }

  /* 看板 KPI 卡片 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .kpi-label { font-size: 10.5px; color: var(--text-2); }
  .kpi-val { font-size: 20px; font-weight: 700; margin: 2px 0; font-family: var(--font-mono); }
  .kpi-sub { font-size: 10px; color: var(--text-3); }

  /* 表格 */
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    text-align: left;
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.12);
    position: sticky;
    top: 0;
  }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-1);
  }
  tr.row-clickable { cursor: pointer; }
  tr.row-clickable:hover { background: rgba(255,255,255,0.03); }
  tr.row-selected { background: rgba(10,132,255,0.14); }
  .mono { font-family: var(--font-mono); font-size: 11.5px; }

  /* 分支同步可视化流水线 */
  .sync-pipeline-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pipeline-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .pipeline-flow {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pipe-node {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--border);
  }
  .pipe-node.ok { border-color: rgba(48,209,88,0.4); background: rgba(48,209,88,0.06); }
  .pipe-node.pending { border-color: rgba(255,159,10,0.45); background: rgba(255,159,10,0.07); }
  .pipe-arrow { color: var(--text-3); font-weight: 700; }

  .env-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .env-card {
    padding: 11px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.24);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .env-card:hover { background: rgba(255,255,255,0.05); }
  .env-card.checked { border-color: rgba(10,132,255,0.5); background: rgba(10,132,255,0.08); }

  /* 工作树底部抽屉 */
  .bottom-drawer {
    height: 170px;
    border-top: 1px solid var(--border);
    background: rgba(16,16,19,0.9);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .drawer-bar {
    height: 32px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .drawer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    font-size: 11.5px;
    padding: 12px;
  }

  /* 底部状态栏 */
  .status-bar {
    height: 28px;
    padding: 0 14px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-3);
    flex-shrink: 0;
  }

  /* 右侧详情卡片 */
  .inspector-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 9px;
    padding: 12px;
  }
  .inspector-card h4 {
    font-size: 11.5px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kv-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0;
    font-size: 11.5px;
  }
  .kv-row .k { color: var(--text-3); }
  .kv-row .v { color: var(--text-1); text-align: right; word-break: break-all; }
  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  /* 设置页面 / 弹窗 */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.58);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    padding: 24px;
  }
  .modal-backdrop.hidden { display: none; }
  .settings-sheet {
    width: 920px;
    max-width: 100%;
    height: 600px;
    max-height: 100%;
    background: #1f1f24;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet-head {
    height: 48px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.02);
  }
  .sheet-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .settings-nav {
    width: 210px;
    border-right: 1px solid var(--border);
    padding: 12px 10px;
    background: rgba(0,0,0,0.16);
  }
  .settings-main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .form-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-box {
    width: 100%;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-1);
    font-size: 12px;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

  <!-- 顶部原型对比控制栏 -->
  <div class="proto-bar">
    <div class="proto-left">
      <span class="proto-badge">布局重构对比原型</span>
      <div class="scheme-switch">
        <button class="scheme-btn active" id="btn-scheme-a" onclick="setScheme('A')">
          方案 A · 左侧常驻仓库树 + 顶部 4 态视图 <span class="scheme-rec">推荐</span>
        </button>
        <button class="scheme-btn" id="btn-scheme-b" onclick="setScheme('B')">
          方案 B · 左侧极简纯菜单 + 顶部全局仓库栏
        </button>
      </div>
      <span class="proto-desc" id="scheme-desc">
        仓库列表永远常驻左侧不消失，顶部横向切换看板/工作树/同步/MR，设置独立在左下角弹窗打开，零割裂感。
      </span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="openSettings()">⚙ 体验「设置」切换效果</button>
    </div>
  </div>

  <div class="app-stage">
    <div class="mac-window">

      <!-- 左侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="window-controls">
          <div class="traffic">
            <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          </div>
          <span class="win-title-mini">GWorkbench</span>
        </div>

        <!-- 工作区标签栏 -->
        <div class="ws-header">
          <div class="ws-row">
            <div class="ws-tabs" id="ws-tabs"></div>
            <button class="ws-add-btn" title="新建工作区标签">+</button>
          </div>
          <div class="ws-path-chip">
            <span id="ws-dir-text">~/vibeCodes/hengjian</span>
            <a onclick="openSettings()">编辑</a>
          </div>
        </div>

        <!-- 方案 A 搜索框（仅方案 A 显示） -->
        <div class="repo-search-wrap" id="repo-search-wrap">
          <input class="repo-search" id="repo-search-input" placeholder="🔍 搜索当前工作区仓库..." oninput="renderAll()" />
        </div>

        <!-- 侧边栏动态主体：方案 A 放常驻仓库树；方案 B 放 4 项极简业务菜单 -->
        <div class="sidebar-scroll" id="sidebar-scroll"></div>

        <!-- 底部固定设置入口（方案 A 弹窗；方案 B 选中态） -->
        <div class="sidebar-bottom-dock">
          <button class="settings-dock-btn" id="settings-dock-btn" onclick="handleSettingsClick()">
            <span>⚙ 工作区与全局设置</span>
            <span style="font-size:10px;color:var(--text-3);" id="settings-shortcut">⌘,</span>
          </button>
        </div>

        <div class="sidebar-footer">
          <span id="sidebar-status">● GitLab · 未配置 Host</span>
          <span>v0.2.9</span>
        </div>
      </aside>

      <!-- 右侧主区域 -->
      <main class="main-workspace" id="main-workspace">
        <!-- 顶部动态 Header -->
        <div id="top-header-container"></div>

        <!-- 主体工作区：当方案 B 选中设置时，全屏双栏设置；否则是中间业务区 + 右侧检查器 -->
        <div class="split-body" id="split-body"></div>

        <div class="status-bar" id="main-status-bar"></div>
      </main>

      <!-- 方案 A 居中设置 Sheet 弹窗（左侧边栏依然稳固可见！） -->
      <div class="modal-backdrop hidden" id="settings-modal" onclick="if(event.target===this) closeSettingsModal()">
        <div class="settings-sheet">
          <div class="sheet-head">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;font-size:13.5px;">⚙ 工作区标签与全局设置</span>
              <span class="pill pill-blue">独立弹窗 · 左侧仓库上下文保持不变</span>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn" onclick="closeSettingsModal()">关闭</button>
              <button class="btn btn-primary" onclick="closeSettingsModal()">保存设置</button>
            </div>
          </div>
          <div class="sheet-body" id="modal-settings-body"></div>
        </div>
      </div>

    </div>
  </div>

<script>
const STATE = {
  scheme: 'A', // 'A' or 'B'
  activeWorkspaceId: 'ws-gitlab',
  activeView: 'dashboard', // 'dashboard' | 'worktrees' | 'sync' | 'mr' | 'settings'(only B)
  activeSettingsTab: 'current',
  selectedRepoId: 'bizark-report',
  selectedWorktreeBranch: 'feat/henry/profit-stats-model-query',
  selectedSyncTargets: ['dev', 'test'],
  showSettingsModal: false,
  workspaces: [
    {
      id: 'ws-github',
      name: 'GitHub',
      platform: 'github',
      dir: '~/vibeCodes/github',
      host: 'https://github.com',
      baselines: ['main'],
      repos: [
        { id: 'AgentFloat', name: 'AgentFloat', branch: 'main', wtCount: 1, dirty: false, unmerged: 0 },
        { id: 'gworkbench', name: 'gworkbench', branch: 'main', wtCount: 0, dirty: true, unmerged: 0 },
        { id: 'fishRadar2', name: 'fishRadar2', branch: 'main', wtCount: 2, dirty: false, unmerged: 1 },
        { id: 'AshLogin', name: 'AshLogin', branch: 'main', wtCount: 0, dirty: false, unmerged: 0 },
        { id: 'rowbridge', name: 'rowbridge', branch: 'main', wtCount: 1, dirty: false, unmerged: 0 }
      ]
    },
    {
      id: 'ws-gitlab',
      name: 'GitLab',
      platform: 'gitlab',
      dir: '~/vibeCodes/hengjian',
      host: 'https://gitlab.company.com',
      baselines: ['master', 'stage', 'test', 'uat'],
      repos: [
        { id: 'bizark-report', name: 'bizark-report', branch: 'pre_prod_henry_meger', wtCount: 1, dirty: false, unmerged: 0 },
        { id: 'bizark_boss', name: 'bizark_boss', branch: 'master', wtCount: 1, dirty: true, unmerged: 1 },
        { id: 'bizark_fin', name: 'bizark_fin', branch: 'master', wtCount: 14, dirty: false, unmerged: 4 },
        { id: 'bizark_erp', name: 'bizark_erp', branch: 'master', wtCount: 1, dirty: false, unmerged: 0 },
        { id: 'bizark_fbb', name: 'bizark_fbb', branch: 'master', wtCount: 2, dirty: false, unmerged: 1 },
        { id: 'bizark_op', name: 'bizark_op', branch: 'master', wtCount: 1, dirty: false, unmerged: 0 },
        { id: 'bizark_openapi', name: 'bizark_openapi', branch: 'master', wtCount: 1, dirty: false, unmerged: 0 },
        { id: 'flowbridge', name: 'flowbridge', branch: 'main', wtCount: 1, dirty: false, unmerged: 0 }
      ]
    }
  ]
};

function currentWS() {
  return STATE.workspaces.find(w => w.id === STATE.activeWorkspaceId) || STATE.workspaces[0];
}
function currentRepo() {
  const ws = currentWS();
  return ws.repos.find(r => r.id === STATE.selectedRepoId) || ws.repos[0];
}

function setScheme(s) {
  STATE.scheme = s;
  STATE.showSettingsModal = false;
  if (s === 'A' && STATE.activeView === 'settings') {
    STATE.activeView = 'dashboard';
  }
  document.getElementById('btn-scheme-a').classList.toggle('active', s === 'A');
  document.getElementById('btn-scheme-b').classList.toggle('active', s === 'B');
  document.getElementById('scheme-desc').textContent = s === 'A'
    ? '仓库列表永远常驻左侧不消失，顶部横向切换看板/工作树/同步/MR，设置独立在左下角弹窗打开，零割裂感。'
    : '左侧边栏永远只放固定导航（上 4 项 + 底部设置），不再堆叠仓库列表；前 4 个页面共用顶部统一仓库选择器。';
  renderAll();
}

function selectWorkspace(id) {
  STATE.activeWorkspaceId = id;
  const ws = currentWS();
  STATE.selectedRepoId = ws.repos[0].id;
  renderAll();
}

function selectRepo(id) {
  STATE.selectedRepoId = id;
  if (STATE.activeView === 'settings') STATE.activeView = 'dashboard';
  renderAll();
}

function selectView(v) {
  STATE.activeView = v;
  renderAll();
}

function handleSettingsClick() {
  if (STATE.scheme === 'A') {
    STATE.showSettingsModal = true;
    renderAll();
  } else {
    STATE.activeView = 'settings';
    renderAll();
  }
}
function openSettings() { handleSettingsClick(); }
function closeSettingsModal() {
  STATE.showSettingsModal = false;
  renderAll();
}

function renderAll() {
  const ws = currentWS();
  const repo = currentRepo();

  // Sidebar compact mode for Scheme B
  document.getElementById('sidebar').classList.toggle('compact', STATE.scheme === 'B');
  document.getElementById('repo-search-wrap').style.display = STATE.scheme === 'A' ? 'block' : 'none';

  // Workspace tabs
  document.getElementById('ws-tabs').innerHTML = STATE.workspaces.map(w => `
    <button class="ws-tab ${w.id === ws.id ? 'active ' + w.platform : ''}" onclick="selectWorkspace('${w.id}')">
      <span>${w.platform === 'github' ? '🐙' : '🦊'}</span>
      <span>${w.name}</span>
    </button>
  `).join('');
  document.getElementById('ws-dir-text').textContent = ws.dir;
  document.getElementById('sidebar-status').textContent = `● ${ws.name} · ${ws.repos.length} 个仓库`;

  // Sidebar main body
  const scroll = document.getElementById('sidebar-scroll');
  if (STATE.scheme === 'A') {
    const q = (document.getElementById('repo-search-input').value || '').toLowerCase();
    const list = ws.repos.filter(r => r.name.toLowerCase().includes(q));
    scroll.innerHTML = `
      <div class="sec-title">
        <span>${ws.name} 仓库 (${list.length})</span>
        <span style="font-weight:400;">常驻列表</span>
      </div>
      ${list.map(r => `
        <div class="nav-item ${r.id === repo.id ? 'active' : ''}" onclick="selectRepo('${r.id}')">
          <div class="nav-left">
            <span class="repo-dot ${r.dirty ? 'warn' : (r.wtCount > 0 ? 'clean' : 'idle')}"></span>
            <span class="name">${r.name}</span>
          </div>
          ${r.wtCount > 0 ? `<span class="nav-badge">${r.wtCount}</span>` : ''}
        </div>
      `).join('')}
    `;
  } else {
    const menus = [
      { id: 'dashboard', icon: '📊', label: '看板', badge: repo.unmerged > 0 ? repo.unmerged : 1 },
      { id: 'worktrees', icon: '🌿', label: '工作树', badge: repo.wtCount || '' },
      { id: 'sync', icon: '🔀', label: '分支同步', badge: '' },
      { id: 'mr', icon: '⬆', label: ws.platform === 'github' ? 'Pull Requests' : 'Merge Requests', badge: 2 }
    ];
    scroll.innerHTML = `
      <div class="sec-title"><span>工作区视图</span></div>
      ${menus.map(m => `
        <div class="nav-item ${STATE.activeView === m.id ? 'active' : ''}" onclick="selectView('${m.id}')">
          <div class="nav-left">
            <span>${m.icon}</span>
            <span class="name">${m.label}</span>
          </div>
          ${m.badge !== '' ? `<span class="nav-badge">${m.badge}</span>` : ''}
        </div>
      `).join('')}
      <div style="padding:14px 8px 4px;font-size:10.5px;color:var(--text-3);line-height:1.5;">
        侧边栏不再堆放仓库列表，切换至「设置」时结构保持 100% 稳定。
      </div>
    `;
  }

  // Dock settings button state
  const dockBtn = document.getElementById('settings-dock-btn');
  dockBtn.classList.toggle('active', (STATE.scheme === 'B' && STATE.activeView === 'settings') || STATE.showSettingsModal);
  document.getElementById('settings-shortcut').textContent = STATE.scheme === 'A' ? '独立弹窗' : '当前页';

  // Top Header
  const headerContainer = document.getElementById('top-header-container');
  if (STATE.scheme === 'A') {
    const viewTabs = [
      { id: 'dashboard', label: '📊 看板', count: 1 },
      { id: 'worktrees', label: '🌿 工作树', count: repo.wtCount },
      { id: 'sync', label: '🔀 分支同步', count: null },
      { id: 'mr', label: ws.platform === 'github' ? '⬆ Pull Requests' : '⬆ Merge Requests', count: 2 }
    ];
    headerContainer.innerHTML = `
      <div class="top-header-a">
        <div class="repo-identity">
          <span style="font-size:15px;">📁</span>
          <span class="repo-title">${repo.name}</span>
          <span class="repo-branch-tag">${repo.branch}</span>
        </div>
        <div class="view-tabs-a">
          ${viewTabs.map(t => `
            <button class="view-tab-a ${STATE.activeView === t.id ? 'active' : ''}" onclick="selectView('${t.id}')">
              <span>${t.label}</span>
              ${t.count !== null && t.count > 0 ? `<span class="tab-count">${t.count}</span>` : ''}
            </button>
          `).join('')}
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn">↻ 刷新</button>
          <button class="btn btn-primary">${STATE.activeView === 'mr' ? '+ 新建 ' + (ws.platform === 'github' ? 'PR' : 'MR') : '+ 新建工作树'}</button>
        </div>
      </div>
    `;
  } else if (STATE.activeView !== 'settings') {
    headerContainer.innerHTML = `
      <div class="top-header-b">
        <div class="repo-bar-left">
          <span style="font-size:11px;color:var(--text-3);">当前项目</span>
          <select class="repo-select-b" onchange="selectRepo(this.value)">
            ${ws.repos.map(r => `<option value="${r.id}" ${r.id === repo.id ? 'selected' : ''}>${r.name} (${r.wtCount})</option>`).join('')}
          </select>
          <div class="quick-repo-pills">
            ${ws.repos.slice(0, 5).map(r => `
              <button class="quick-repo-pill ${r.id === repo.id ? 'active' : ''}" onclick="selectRepo('${r.id}')">${r.name}</button>
            `).join('')}
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn">↻ 刷新</button>
          <button class="btn btn-primary">+ 新建工作树</button>
        </div>
      </div>
    `;
  } else {
    headerContainer.innerHTML = `
      <div class="top-header-b">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-weight:700;font-size:13.5px;">⚙ 工作区标签与全局设置</span>
          <span class="pill pill-blue">结构与上方 4 个视图完全对齐（中栏目录 + 右侧详情）</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn">还原更改</button>
          <button class="btn btn-primary">保存设置</button>
        </div>
      </div>
    `;
  }

  // Body content
  const splitBody = document.getElementById('split-body');
  if (STATE.scheme === 'B' && STATE.activeView === 'settings') {
    splitBody.innerHTML = renderSettingsSplitMarkup();
  } else if (STATE.activeView === 'dashboard') {
    splitBody.innerHTML = renderDashboard(ws, repo);
  } else if (STATE.activeView === 'worktrees') {
    splitBody.innerHTML = renderWorktrees(ws, repo);
  } else if (STATE.activeView === 'sync') {
    splitBody.innerHTML = renderSync(ws, repo);
  } else {
    splitBody.innerHTML = renderMRs(ws, repo);
  }

  // Modal settings (Scheme A)
  const modal = document.getElementById('settings-modal');
  modal.classList.toggle('hidden', !STATE.showSettingsModal);
  if (STATE.showSettingsModal) {
    document.getElementById('modal-settings-body').innerHTML = renderSettingsSplitMarkup();
  }

  // Status bar
  document.getElementById('main-status-bar').innerHTML = `
    <div>● ${repo.name} · </> Git 2.39.5 · 基线: ${ws.baselines.join(' / ')}</div>
    <div style="font-family:var(--font-mono);">${ws.dir}/${repo.name}</div>
  `;
}

function renderDashboard(ws, repo) {
  return `
    <div class="center-pane">
      <div class="sub-toolbar">
        <div class="seg-control">
          <button class="seg-btn active">全部</button>
          <button class="seg-btn">已合入基线</button>
          <button class="seg-btn">未合入</button>
          <button class="seg-btn">有改动</button>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-primary">✦ 空间清理 (1)</button>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">工作树总数</div>
          <div class="kpi-val">${repo.wtCount + 1}</div>
          <div class="kpi-sub">含 1 个主仓库</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">已全部合入 (可清理)</div>
          <div class="kpi-val" style="color:var(--green);">1</div>
          <div class="kpi-sub">基线: ${ws.baselines.join(' / ')}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">未完成合入</div>
          <div class="kpi-val" style="color:var(--orange);">${repo.unmerged}</div>
          <div class="kpi-sub">仍在开发中</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">未提交改动</div>
          <div class="kpi-val" style="color:${repo.dirty ? 'var(--red)' : 'var(--text-1)'};">${repo.dirty ? 1 : 0}</div>
          <div class="kpi-sub">${repo.dirty ? '清理前需先提交' : '工作区干净'}</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>分支</th>
              <th>功能描述</th>
              ${ws.baselines.map(b => `<th>${b}</th>`).join('')}
              <th>状态</th>
              <th>更新时间</th>
            </tr>
          </thead>
          <tbody>
            <tr class="row-clickable">
              <td class="mono">${repo.branch}</td>
              <td style="color:var(--text-3);">主仓库</td>
              ${ws.baselines.map(() => `<td style="color:var(--text-3);">—</td>`).join('')}
              <td><span class="pill pill-blue">基准仓库</span></td>
              <td style="color:var(--text-3);">1周前</td>
            </tr>
            <tr class="row-clickable row-selected">
              <td class="mono">feat/henry/profit-stats-model-query</td>
              <td>利润统计增加型号查询</td>
              ${ws.baselines.map(() => `<td style="color:var(--green);font-weight:700;">✔</td>`).join('')}
              <td><span class="pill pill-green">全部合入</span></td>
              <td style="color:var(--text-2);">1周前</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="right-pane">
      <div>
        <div style="font-size:15px;font-weight:700;">feat/henry/profit-stats-model-query</div>
        <div style="font-size:11.5px;color:var(--text-2);margin-top:2px;">${repo.name} · 工作树</div>
      </div>
      <div class="inspector-card">
        <h4>基本信息 <span class="pill pill-green">干净</span></h4>
        <div class="kv-row"><span class="k">路径</span><span class="v mono">~/worktrees/${repo.name}/feat-henry-profit...</span></div>
        <div class="kv-row"><span class="k">占用空间</span><span class="v mono">126M</span></div>
        <div class="kv-row"><span class="k">最近提交</span><span class="v">1周前</span></div>
      </div>
      <div class="inspector-card">
        <h4>基线合入检查</h4>
        ${ws.baselines.map(b => `
          <div class="kv-row"><span class="k mono">${b}</span><span class="v" style="color:var(--green);">● 已合入</span></div>
        `).join('')}
      </div>
      <div class="action-grid">
        <button class="btn btn-primary">⌘ IDE 中打开</button>
        <button class="btn">❯_ 终端打开</button>
        <button class="btn">↓ Pull</button>
        <button class="btn">↑ Push</button>
        <button class="btn" style="grid-column:1/-1;" onclick="selectView('sync')">🔀 一键前往分支同步</button>
        <button class="btn" style="grid-column:1/-1;" onclick="selectView('mr')">⬆ 为此分支创建 ${ws.platform === 'github' ? 'PR' : 'MR'}</button>
      </div>
    </div>

function toggleSyncEnv(env) {
  if (STATE.selectedSyncTargets.includes(env)) {
    STATE.selectedSyncTargets = STATE.selectedSyncTargets.filter(x => x !== env);
  } else {
    STATE.selectedSyncTargets.push(env);
  }
  renderAll();
}
